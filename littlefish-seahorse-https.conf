server {
    listen 80;
    server_name seahorse.littlefish.love;
    rewrite ^(.*)$ https://${server_name}$1 permanent; 
}



server {
  listen 443 ssl;

  server_name seahorse.littlefish.love;
  server_tokens off;

  root /opt/littlefish-seahorse/;
  index index.html index.htm;
  ssl_certificate   /etc/nginx/conf.d/ss-cert/9175177_seahorse.littlefish.love.pem;
  ssl_certificate_key  /etc/nginx/conf.d/ss-cert/9175177_seahorse.littlefish.love.key;
  ssl_session_timeout 5m;
  ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  ssl_prefer_server_ciphers on;

#  location / {
#    # 用于配合 browserHistory使用
#    try_files $uri $uri/ /index.html;
#   }

  location ~ .*\.(stl|pdf|zip|rar)$
  {
    add_header Content-Disposition "attachment; filename=$request_filename";
  }



}

